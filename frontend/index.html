<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de gestión de citas de El Arco Laboratorios" />
    <meta name="theme-color" content="#e7edf1" />
    <title>El Arco Laboratorios — Gestión de citas</title>

    <!--
      `favicon.png` es el logotipo recortado a su contenido y encajado en un
      cuadrado, con el fondo transparente. Se genera aparte y no se apunta a
      `logo.png` porque ese archivo es de 3:2 y pesa de más para un icono.
    -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Dos familias, con el reparto que fija index.css: Inter para todo lo que se
      lee y se rellena, Plus Jakarta Sans para titulares y cifras. Van con
      `display=swap` para que el texto se lea desde el primer pintado; si no hay
      red, la pila de respaldo de index.css mantiene el diseño.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&family=Plus+Jakarta+Sans:wght@300..600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
